name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure private MBAsyncNetworking access
        env:
          MOBVEN_PACKAGES_TOKEN: ${{ secrets.MOBVEN_PACKAGES_TOKEN }}
        run: |
          test -n "${MOBVEN_PACKAGES_TOKEN}" || {
            echo "MOBVEN_PACKAGES_TOKEN must contain read access to mobven/MBAsyncNetworkingXCFramework." >&2
            exit 1
          }
          git config --global \
            url."https://x-access-token:${MOBVEN_PACKAGES_TOKEN}@github.com/mobven/MBAsyncNetworkingXCFramework.git".insteadOf \
            "https://github.com/mobven/MBAsyncNetworkingXCFramework.git"

      - name: Show Swift version
        run: swift --version

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -scheme MBIssueKit
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test
        run: swift test --parallel

      - name: Build DocC documentation
        run: >-
          xcodebuild
          docbuild
          -scheme MBIssueKit
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/docc-derived-data
          CODE_SIGNING_ALLOWED=NO
