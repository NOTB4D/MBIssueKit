name: Release XCFramework

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binary:
    name: Build closed binary
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Swift Testing suite
        run: swift test --parallel

      - name: Build XCFramework
        run: ./Scripts/build-xcframework.sh .build/release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBIssueKit-XCFramework
          path: |
            .build/release/MBIssueKit.xcframework.zip
            .build/release/checksum.txt

      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            .build/release/MBIssueKit.xcframework.zip \
            .build/release/checksum.txt \
            --clobber
